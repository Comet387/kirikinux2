name: native-linux

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libx11-dev libsdl2-dev dpkg-dev wget
      - name: Configure
        run: cmake -S linux -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build and smoke test
        run: |
          cmake --build build --parallel
          ./build/kirikiroid2-linux --help
          ./build/kirikiroid2-linux --probe /dev/null || test "$?" -eq 2
          ./build/kirikiroid2-linux --no-window
      - name: Build Debian package
        run: cpack --config build/CPackConfig.cmake -B build
      - name: Install linuxdeploy tools
        run: |
          wget -q -O linuxdeploy.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy.AppImage
          wget -q -O appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications
          cp build/kirikiroid2-linux AppDir/usr/bin/
          cp linux/kirikiroid2-linux.desktop AppDir/usr/share/applications/
          cp icons/kirikiroid2-linux.png AppDir/
          ./linuxdeploy.AppImage --appdir AppDir --executable AppDir/usr/bin/kirikiroid2-linux --desktop-file AppDir/usr/share/applications/kirikiroid2-linux.desktop --icon-file AppDir/kirikiroid2-linux.png
          ARCH=x86_64 ./appimagetool.AppImage AppDir kirikiroid2-linux-x86_64.AppImage
      - name: Upload DEB and AppImage
        uses: actions/upload-artifact@v4
        with:
          name: kirikiroid2-linux-packages
          path: |
            build/*.deb
            kirikiroid2-linux-x86_64.AppImage
